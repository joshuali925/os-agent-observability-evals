# OpenTelemetry Collector config for the Acme tutorial.
# Receives OTLP from the agent, normalizes spans, fans out:
#   - traces  -> Data Prepper (OTLP gRPC on 21890)
#   - metrics -> Prometheus (scraped from :8889)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

exporters:
  # Traces -> Data Prepper
  otlp/data-prepper:
    endpoint: data-prepper:21890
    tls:
      insecure: true
  # Metrics -> exposed for Prometheus to scrape
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

connectors:
  # Derive RED metrics (calls_total, duration_seconds_*) from the trace stream so
  # Prometheus has data even though the agent emits traces, not OTel metrics.
  # gen_ai.* span attributes are promoted to metric labels for per-agent RED.
  spanmetrics:
    histogram:
      unit: s
      explicit:
        buckets: [50ms, 100ms, 250ms, 500ms, 1s, 2s, 4s, 8s, 16s]
    dimensions:
      - name: gen_ai.agent.name
      - name: gen_ai.request.model
      - name: gen_ai.operation.name
    metrics_flush_interval: 15s

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/data-prepper, spanmetrics, debug]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
